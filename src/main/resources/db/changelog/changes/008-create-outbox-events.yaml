databaseChangeLog:
  # Transactional outbox: events are written here in the same transaction as the business
  # change, then published to Kafka by OutboxRelay. An event is never lost after a commit.
  - changeSet:
      id: 008-1-create-outbox-events-table
      author: payment-api
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_outbox_events
                    nullable: false

              # Sent as the eventId header; consumers use it to ignore duplicates.
              - column:
                  name: event_id
                  type: CHAR(36)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_outbox_events_event_id

              - column:
                  name: event_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: topic
                  type: VARCHAR(249)
                  constraints:
                    nullable: false

              # Kafka message key, e.g. the payment ID, so one aggregate's events stay in order.
              - column:
                  name: message_key
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false

              # Extra Kafka headers as JSON, e.g. the trace context of the request that wrote the event.
              - column:
                  name: headers
                  type: TEXT

              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false

              - column:
                  name: published_at
                  type: DATETIME(6)

              - column:
                  name: attempts
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: last_error
                  type: VARCHAR(1000)

  # The relay reads WHERE published_at IS NULL ORDER BY id. Cleanup deletes by published_at.
  - changeSet:
      id: 008-2-create-outbox-events-pending-index
      author: payment-api
      changes:
        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_events_published_at_id
            columns:
              - column:
                  name: published_at
              - column:
                  name: id
