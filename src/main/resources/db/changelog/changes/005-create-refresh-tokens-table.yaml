databaseChangeLog:
  - changeSet:
      id: 005-create-refresh-tokens-table
      author: payment-api
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_refresh_tokens
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_refresh_tokens_user
                    references: users(id)

              # SHA-256 of the token. The raw token is never stored.
              - column:
                  name: token_hash
                  type: CHAR(64)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_refresh_tokens_token_hash

              - column:
                  name: expires_at
                  type: DATETIME
                  constraints:
                    nullable: false

              - column:
                  name: revoked_at
                  type: DATETIME

              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
