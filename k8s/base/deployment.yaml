apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
spec:
  # Two or more: Kafka splits partitions between them, and the outbox relay shares work
  # through SKIP LOCKED. Liquibase's lock table stops them migrating at the same time.
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: payment-api
      # No Docker-link-style environment variables for every Service in the namespace.
      enableServiceLinks: false
      # Spring shuts down gracefully: in-flight requests finish and Kafka offsets are committed.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          # Prefer different nodes, so one node failing doesn't take every replica.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: payment-api
      containers:
        - name: payment-api
          image: payment-api
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: payment-api-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: payment-api-secrets
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-api-secrets
                  key: db-password
            - name: SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: payment-api-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            # Memory limit only: a CPU limit would throttle the JVM, especially at startup.
            limits:
              memory: 768Mi
          # Generous: the first start runs database migrations.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          # Restarts the container only if the app itself is broken, never for a dependency outage.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          # Takes the pod out of the Service while the database or Redis is unreachable.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            # Gives the Service time to stop routing here before shutdown starts.
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The root filesystem is read-only; Tomcat and the JVM need a writable /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
